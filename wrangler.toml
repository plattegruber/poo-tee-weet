name = "poo-tee-weet-worker"
main = "worker/src/index.ts"
compatibility_date = "2024-05-17"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
ALLOWED_ORIGINS = "https://poo-tee-weet.com,https://www.poo-tee-weet.com"
# platte.dev plugin: documents tagged "platte.dev" are committed as posts.
# GITHUB_TOKEN is a secret (wrangler secret put GITHUB_TOKEN). Set
# PLATTE_DEV_OWNER_ID to the Clerk user id allowed to publish.
PLATTE_DEV_OWNER_ID = "user_355k1Q9HVxcBkZG611OHVKTRsSS"
PLATTE_DEV_REPO = "plattegruber/plattedotdev"
PLATTE_DEV_BRANCH = "main"
PLATTE_DEV_POSTS_DIR = "src/content/posts"

[[durable_objects.bindings]]
name = "DocumentDO"
class_name = "DocumentDO"

[[durable_objects.bindings]]
name = "UserIndexDO"
class_name = "UserIndexDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DocumentDO", "UserIndexDO"]
